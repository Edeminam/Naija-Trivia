# Fly.io config for the game server.  fly launch --no-deploy --copy-config && fly deploy
app = "naija-trivia-clash"
primary_region = "lhr"   # closest Fly region to Lagos with full features; jnb is an alternative

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "2567"
  NODE_ENV = "production"
  # Without DATABASE_URL (quick play, no Supabase) the embedded Postgres lives on the volume below.
  PGLITE_DIR = "/data/pglite"

[mounts]
  source = "ntc_data"
  destination = "/data"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = "off"     # keep rooms alive; matches are in-memory
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 4000

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "90s"   # the first boot on an empty volume applies migrations and loads the seed
  method = "GET"
  path = "/health"
